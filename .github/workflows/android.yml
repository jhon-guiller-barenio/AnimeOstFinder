name: Build SakuraSound Android
on:
  workflow_dispatch:
  push:
    branches: [main, codex/sakurasound-app]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable test APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Export website verification file
        run: |
          mkdir -p android-verification
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > /tmp/sakura-cert.txt
          python3 - <<'PYTHON'
          import re, json
          from pathlib import Path
          digest = re.search(r'certificate SHA-256 digest: ([0-9a-fA-F]+)', Path('/tmp/sakura-cert.txt').read_text()).group(1).upper()
          fingerprint = ':'.join(digest[i:i+2] for i in range(0, len(digest), 2))
          statements = [{'relation':['delegate_permission/common.handle_all_urls'],'target':{'namespace':'android_app','package_name':'app.sakurasound.player','sha256_cert_fingerprints':[fingerprint]}}]
          Path('android-verification/assetlinks.json').write_text(json.dumps(statements, indent=2))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: SakuraSound-Android-test
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-verification/assetlinks.json
          retention-days: 30
